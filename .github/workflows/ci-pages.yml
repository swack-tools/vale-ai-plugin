name: Checks and documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verified Vale
        run: |
          python scripts/install_vale_ci.py "$RUNNER_TEMP/vale-bin"
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
      - name: Install required markup parsers
        run: |
          python -m pip install docutils==0.23
          gem install asciidoctor --version 2.0.26 --no-document --install-dir "$RUNNER_TEMP/gems" --bindir "$RUNNER_TEMP/gem-bin"
          echo "GEM_HOME=$RUNNER_TEMP/gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gem-bin" >> "$GITHUB_PATH"
      - name: Test hooks and installers
        env:
          VALE_REQUIRE_PARSERS: '1'
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.log
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results.log
          retention-days: 7
      - name: Check documentation style
        run: python scripts/check_docs.py
  native:
    name: Native ${{ matrix.host }} (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [codex, claude]
        scope: [changed-files, new-findings]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install verified Vale
        run: |
          python scripts/install_vale_ci.py "$RUNNER_TEMP/vale-bin"
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
      - name: Install pinned Codex client
        if: matrix.host == 'codex'
        run: npm install --global @openai/codex@0.158.0
      - name: Install pinned Claude client
        if: matrix.host == 'claude'
        run: npm install --global @anthropic-ai/claude-code@2.1.277
      - name: Exercise Codex marketplace and hooks
        if: matrix.host == 'codex'
        run: python scripts/codex_smoke.py --plugin --feedback-scope "${{ matrix.scope }}"
      - name: Exercise Claude marketplace and hooks
        if: matrix.host == 'claude'
        run: python scripts/claude_smoke.py --scope project --feedback-scope "${{ matrix.scope }}"
      - name: Retain native fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.host }}-${{ matrix.scope }}
          path: |
            .research/*-smoke.jsonl
            .research/*-smoke.stderr
            .research/*-smoke-requests.json
          retention-days: 7

  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-docs.txt
      - name: Install verified Vale for generated pages
        run: |
          python scripts/install_vale_ci.py "$RUNNER_TEMP/vale-bin"
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
      - run: python scripts/build_docs.py
      - name: Check generated page style
        run: python scripts/check_docs.py site/*.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    name: Deploy GitHub Pages
    needs: [test, native, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
