name: Release plugin archives

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install catalog validator dependencies
        run: python -m pip install -r requirements-catalog.txt
      - name: Validate catalog metadata
        run: python scripts/check_catalog_info.py
      - name: Require tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require tag to match plugin version
        run: |
          python3 scripts/validate_release_version.py "$GITHUB_REF_NAME"
      - name: Build Claude and Codex archives
        run: python3 scripts/package_release.py "$RUNNER_TEMP/release"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/vale-claude.zip" \
            "$RUNNER_TEMP/release/vale-codex.zip" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --verify-tag --generate-notes
